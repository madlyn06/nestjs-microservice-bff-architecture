name: e-invoice-provider

services:
  mongodb:
    image: mongo
    container_name: e-invoice-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - ./docker/docker_data/mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - einvoice-nw

  postgres:
    image: postgres
    container_name: e-invoice-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: e-invoice
    volumes:
      - ./docker/docker_data/postgres_data:/var/lib/postgresql
    networks:
      - einvoice-nw

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak-25.0.0
    ports:
      - '8180:8080'
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_LOG_LEVEL: info
    command: start-dev
    restart: unless-stopped
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - einvoice-nw

  redis:
    image: redis
    container_name: redis_server
    ports:
      - '6379:6379'
    networks:
      - einvoice-nw
    restart: unless-stopped
    volumes:
      - ./docker/docker_data/redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight-ui
    ports:
      - '5540:5540'
    networks:
      - einvoice-nw
    depends_on:
      - redis
    volumes:
      - ./docker/docker_data/redisinsight_data:/data

volumes:
  keycloak_data:
    driver: local

networks:
  einvoice-nw:
    driver: bridge
    name: einvoice-nw
